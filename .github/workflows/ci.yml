# This workflow implements CLAIM-9.2 and NEVER-9.8 from docs/design/stories/9.md.
#
# CLAIM-9.2: build, test, lint, typecheck, skill-lint and claim-lint must report as six
# separately named required checks. Each is its own job below; do not merge
# them into one job or add a matrix (a matrix renames the context to
# "job (dim1, dim2)" and breaks branch protection).
#
# NEVER-9.8 (anti-claim): a check that is skipped or absent must never cause the
# PR to report as passing. Two GitHub behaviours would violate this if
# reintroduced here, so they are deliberately absent:
#
#   1. A job skipped by an `if:` condition reports status "success" (GitHub's
#      required-status-check docs list success, skipped and neutral as all
#      counting as passing). Therefore none of the six required jobs below
#      may ever carry an `if:` key, for any reason.
#   2. A workflow skipped entirely by `paths:`, `paths-ignore:` or a
#      `branches:` filter on `pull_request` leaves its required checks stuck
#      at "pending" forever, which blocks the PR just as permanently as a
#      failure would. Therefore this file has no `paths`/`paths-ignore`
#      filter anywhere, and `pull_request` is bare (no `branches:`) so it
#      fires against every base branch, including the story branches that
#      CONTRIBUTING.md's Branching section says task PRs target.
#
# If someone adds a summary/gate job later, it must carry `if: always()` and
# check each dependency's result with `== 'success'`, never `!= 'failure'`
# (skipped is neither success nor failure, and would slip through).

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

env:
  BUN_VERSION: "1.4.0"
  NODE_VERSION: "20"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install
      - run: bun run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install
      - run: bun test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      # tsc is a node shebang script resolved from node_modules/.bin; bun
      # install must run before it, per CONTRIBUTING.md's node prerequisite.
      - run: bun install
      - run: bun run typecheck

  skill-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install
      # skills/ is the FRONTMATTER population. The body rules added by S2.1
      # (#280, Decision 11 of docs/design/stories/35.md) additionally scan
      # references/ and agents/, which the script resolves itself relative to
      # the repo root — see CONTRACT_DIRS in scripts/skill-lint.ts. The report
      # prints BOTH counts so neither population can silently go to zero.
      - run: bun run skill-lint skills/

  # claim-lint enforces CLAIM-194.1 through CLAIM-194.4 of
  # docs/design/stories/194.md. It HAS SINCE BEEN PROMOTED: it is now one of
  # the six required contexts in both main's branch protection and ruleset
  # 21656025 — verified live via `gh api repos/.../branches/main/protection`
  # and the ruleset, each listing claim-lint among exactly six contexts.
  # scripts/verify-required-checks.sh and scripts/verify-workflow-hygiene.sh
  # were updated in that same promotion commit, 15e5a36 ("#204: make
  # claim-lint the sixth required check") — each hardcodes the job list
  # twice, and one commit carries all four sites.
  #
  # THIS COMMENT WAS FALSE FOR AS LONG AS THE PROMOTION HAD BEEN DONE. It
  # asserted the opposite of the live configuration, in the same file that
  # tells the next person how to promote a job. Re-read a comment's claim
  # against the thing it describes before you copy its advice.
  #
  # The durable lesson from getting here stands, because the new `seam` job
  # below depends on it: per the decision recorded on issue #204, a required
  # context that has never reported sits at "pending" forever and blocks
  # every PR permanently, so a context must first merge to main and report on
  # a real PR before it can be made required. That sequencing worked for
  # claim-lint; `seam` is currently at the "merged but not yet required"
  # stage claim-lint itself just passed through.
  claim-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install
      - run: bun run claim-lint

  # seam is build target 7 of docs/design/stories/293.md: the deterministic,
  # offline, secret-free seam rung. It runs the skill harness's default
  # scenario roster (`bun run skill-harness`, no --inject) against the
  # in-memory fake forge, never a real one, so it needs no token and cannot
  # flake on network state. Unlike smoke-install below, this job can
  # MEANINGFULLY FAIL today: `bun run skill-harness --inject` is the proof —
  # each of the five injectable failure modes (a zeroed rate-limit budget,
  # the header-absent third state, a truncated unpaginated list, a silent
  # no-op mutation, a transient connection error) makes the harness report a
  # real, non-vacuous failure, per docs/test-plans/293-plan.md case 9. This
  # job runs the plain (non-`--inject`) roster, so it is the everyday check;
  # the `--inject` roster is exercised by test, not by this job.
  #
  # It is deliberately NOT YET REQUIRED, same reasoning that governed
  # claim-lint above, for two independently sufficient reasons:
  #   1. A required context that has never reported sits at "pending"
  #      forever and blocks every PR permanently (issue #204, restated
  #      above). This job must first merge to main and report on a real PR.
  #   2. story/47-s2-3-execution-skills and its six open task issues have no
  #      seam job on their branch heads yet. Promoting this job to required
  #      now would permanently block PR #313 and every S2.3 task PR, since
  #      their heads predate this commit and can never report this context.
  #
  # PROMOTION PROCEDURE — TRACKED AS ISSUE #334, which carries this list as
  # a checklist and records both unblocking conditions. It is deliberately
  # NOT a sub-issue of #293: the promotion cannot happen while S2.6 is in
  # flight, so that Story's exit must not depend on it.
  #
  # All FOUR of the following in-tree sites must be edited in ONE commit, or
  # the four-way agreement the tests in test/ci-workflow.test.ts assert on
  # will go red:
  #   (i)   scripts/verify-required-checks.sh's REQUIRED_CONTEXTS array
  #   (ii)  the same file's inline `required_status_checks.contexts[]=`
  #         list in the branch-protection help text (the `gh api` example
  #         under the 404 branch)
  #   (iii) scripts/verify-workflow-hygiene.sh's REQUIRED_JOBS array
  #   (iv)  the `required = [...]` Python list inside that same file's
  #         `<<'PYEOF'` heredoc (run_yaml_parse) — THIS FOURTH ONE IS THE
  #         ONE THAT GETS MISSED, because it is nested inside a heredoc and
  #         does not show up in a plain grep for REQUIRED_JOBS or
  #         REQUIRED_CONTEXTS.
  # Beyond the four in-tree sites, TWO OUT-OF-TREE settings must also be
  # updated by a human, as a SEPARATE action taken only after this job has
  # actually reported on main at least once:
  #   - main's branch protection required status checks
  #   - ruleset 21656025 (story-branch-checks, covering refs/heads/story/**)
  #
  # NEVER-9.8 still applies to this job even though it is not required: no
  # `if:`, no `strategy:`/matrix, no `paths:` filter — a skipped job reports
  # success, and a job that cannot fail is worse than useless as a signal.
  seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install
      - run: bun run skill-harness

  # This job is intentionally NOT added to branch protection and must never
  # be made required. docs/milestones/M1.md and PLAN.md's risk table both
  # describe a both-host install smoke test, but packages/installer has no
  # cli.ts yet (only a 10-line src/index.ts exporting describeInstall()) and
  # docs/design/stories/9.md puts installer CLI behaviour out of scope for this
  # story. Making this required while it cannot fail would itself be an
  # NEVER-9.8 violation: a check that cannot meaningfully fail is equivalent to
  # one that is always skipped. Until packages/installer/src/cli.ts exists
  # (M8), this job only builds the installer package and runs the workspace
  # tests, then says so explicitly.
  smoke-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bun install
      - run: bun run build --filter iai-installer
      - run: bun test
      - run: |
          echo "NOTE: a real both-host install smoke test is not yet possible."
          echo "packages/installer/src/cli.ts does not exist yet; installer"
          echo "CLI behaviour is out of scope for this story per"
          echo "docs/design/stories/9.md. The both-host install smoke test is"
          echo "delivered by milestone M8."
